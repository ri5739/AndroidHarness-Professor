name: Professor integration CI

on:
  push:
    branches:
      - professor/integration
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

# Keep one current build per branch; every commit otherwise queues redundant full APK builds.
concurrency:
  group: professor-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
      - name: Accept SDK licenses
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          yes | "$SDKMANAGER" --licenses || true
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run JVM unit tests
        run: ./gradlew testDebugUnitTest

  debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
      - name: Install native toolchain
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "ndk;27.2.12479018" "cmake;3.22.1"
          sudo apt-get update
          sudo apt-get install -y glslc
          GLSLC="$(command -v glslc)"
          if [ -z "$GLSLC" ]; then
            echo "glslc package installed but compiler not found on PATH" >&2
            exit 1
          fi
          "$GLSLC" --version
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew assembleDebug
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AndroidHarness-Professor-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  # GitHub-hosted runners may not expose a working nested KVM device.
  # Keep emulator tests opt-in; JVM tests and APK build remain required on every push.
  instrumentation-tests:
    if: ${{ vars.ENABLE_ANDROID_EMULATOR_TESTS == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
      - name: Install native toolchain
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "ndk;27.2.12479018" "cmake;3.22.1"
          sudo apt-get update
          sudo apt-get install -y glslc
          glslc --version
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run Android migration and persistence tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          disable-linux-hardware-acceleration: false
          emulator-boot-timeout: 900
          script: ./gradlew connectedDebugAndroidTest

  publish-beta-release:
    needs: debug-apk
    if: >-
      ${{ github.ref == 'refs/heads/professor/integration' &&
          (github.event_name == 'workflow_dispatch' ||
           startsWith(github.event.head_commit.message, 'release(professor)')) }}
    runs-on: ubuntu-24.04
    steps:
      - name: Download debug APK artifact
        uses: actions/download-artifact@v4
        with:
          name: AndroidHarness-Professor-debug-apk
          path: release-apk
      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: professor-beta-${{ github.run_number }}
          name: Agent Professor Beta ${{ github.run_number }}
          prerelease: true
          generate_release_notes: true
          files: release-apk/*.apk
